<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mock-up: Penumbra not loaded</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <div class="game-backdrop"></div>
    <div class="mockup-banner">Mock-up</div>
    <div class="scene-label">Penumbra not loaded — the window shows only the status line; /pmm probe stops after the first line</div>
    <div class="imgui-window wd" id="w" style="top: 50px; left: 260px; width: 760px; height: 520px;">
      <div class="imgui-titlebar"><span>Wardrobe14</span><span class="close">✕</span></div>
      <div class="imgui-body"></div>
    </div>
    <div class="chat-panel" id="chat" style="width: 900px;"></div>
    <div class="chat-hint">Illustrative chat lines — not a real client log</div>
    <script src="mock.js"></script>
    <script>
renderWindow(document.getElementById('w'), { penumbra: 'Penumbra not loaded' });
document.getElementById('chat').innerHTML = [`[Wardrobe14] Penumbra: Penumbra not loaded (API 0.0); Glamourer: OK (API ${GLAMOURER_API})`].map((l) => `<div class="chat-line echo">${esc(l)}</div>`).join('');
    </script>
  </body>
</html>
